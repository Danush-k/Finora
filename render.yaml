services:
  - type: web
    name: finora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://finora-11dp.onrender.com/api/gmail/callback"
      - key: FRONTEND_REDIRECT_URL
        value: "https://finora-app-13673.web.app/settings"
      - key: GMAIL_SYNC_ENABLED
        value: "true"
      - key: GMAIL_SYNC_DELAY_MS
        value: "120000"
